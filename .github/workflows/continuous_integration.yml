name: SitePay source policy, unit and API integration checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify source rules
        run: python scripts/check_project_rules.py .
      - name: Run all Python tests
        run: python -m pytest -q
      - name: Verify Python syntax
        run: python -m compileall -q backend scripts
      - name: Ruff lint
        run: ruff check backend scripts

  postgresql_migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sitepay_ci
          POSTGRES_USER: sitepay_ci
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitepay_ci -d sitepay_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SITEPAY_ENVIRONMENT: testing
      SITEPAY_DATABASE_URL: postgresql+psycopg://sitepay_ci:ci-test-only-password@localhost:5432/sitepay_ci
      SITEPAY_JWT_SECRET: ci-test-signing-secret-not-for-production-2026
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Apply PostgreSQL migrations
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Verify PostgreSQL constraints and audit triggers
        run: python -m scripts.verify_postgres_migration

  docker_configuration:
    runs-on: ubuntu-latest
    env:
      SITEPAY_DB_PASSWORD: ci-test-only-password
      SITEPAY_JWT_SECRET: ci-test-signing-secret-not-for-production-2026
      SITEPAY_OBJECT_STORAGE_ACCESS_KEY: sitepay_ci_storage
      SITEPAY_OBJECT_STORAGE_SECRET_KEY: ci-only-evidence-storage-password-1234
      SITEPAY_ENABLE_EVIDENCE_PREVIEW: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build API container image
        run: docker compose build api
      - name: Start PostgreSQL
        run: docker compose up -d postgres
      - name: Apply migrations in API container
        run: docker compose run --rm api python -m alembic -c backend/alembic.ini upgrade head
      - name: Start API container
        run: docker compose up -d api
      - name: Verify real HTTP workflow
        run: python -m scripts.smoke_docker_api
      - name: Verify live evidence and storage workflow
        run: python -m scripts.smoke_docker_evidence
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100 api postgres
      - name: Remove synthetic CI infrastructure
        if: always()
        run: docker compose down -v --remove-orphans
