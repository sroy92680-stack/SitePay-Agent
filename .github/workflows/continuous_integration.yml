name: Phase 0 policy and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase0:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Verify source rules
        run: python scripts/check_project_rules.py .
      - name: Run tests
        run: python -m pytest -q scripts/tests
      - name: Verify Python syntax
        run: python -m compileall -q scripts
      - name: Ruff lint
        run: ruff check scripts
