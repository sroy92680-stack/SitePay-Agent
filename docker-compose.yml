services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sitepay
      POSTGRES_USER: sitepay
      POSTGRES_PASSWORD: ${SITEPAY_DB_PASSWORD:?Set a unique development database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitepay -d sitepay"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${SITEPAY_OBJECT_STORAGE_ACCESS_KEY:?Set local storage access key}
      MINIO_ROOT_PASSWORD: ${SITEPAY_OBJECT_STORAGE_SECRET_KEY:?Set local storage secret}
    volumes:
      - evidence_data:/data

  minio_init:
    image: docker.io/pgsty/mc:RELEASE.2026-11-09T00-00-00Z
    depends_on:
      minio:
        condition: service_started
    environment:
      STORAGE_USER: ${SITEPAY_OBJECT_STORAGE_ACCESS_KEY:?Set local storage access key}
      STORAGE_PASSWORD: ${SITEPAY_OBJECT_STORAGE_SECRET_KEY:?Set local storage secret}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until mc alias set private http://minio:9000 "$STORAGE_USER" "$STORAGE_PASSWORD";
      do sleep 2; done;
      mc mb --ignore-existing private/sitepay-evidence;
      mc anonymous set none private/sitepay-evidence;

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SITEPAY_ENVIRONMENT: development
      SITEPAY_DATABASE_URL: postgresql+psycopg://sitepay:${SITEPAY_DB_PASSWORD:?Set password}@postgres:5432/sitepay
      SITEPAY_JWT_SECRET: ${SITEPAY_JWT_SECRET:?Set a random JWT signing secret}
      SITEPAY_JWT_MINUTES: "30"
      SITEPAY_CORS_ORIGINS: http://localhost:5173
      SITEPAY_ENABLE_EVIDENCE_PREVIEW: ${SITEPAY_ENABLE_EVIDENCE_PREVIEW:-false}
      SITEPAY_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      SITEPAY_OBJECT_STORAGE_BUCKET: sitepay-evidence
      SITEPAY_OBJECT_STORAGE_ACCESS_KEY: ${SITEPAY_OBJECT_STORAGE_ACCESS_KEY:?Set local storage access key}
      SITEPAY_OBJECT_STORAGE_SECRET_KEY: ${SITEPAY_OBJECT_STORAGE_SECRET_KEY:?Set local storage secret}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
  evidence_data:
