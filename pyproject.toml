[project]
name = "sitepay-agent"
version = "0.0.1"
description = "Evidence-based construction payment intelligence"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
