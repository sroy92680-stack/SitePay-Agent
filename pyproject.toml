[project]
name = "sitepay-agent"
version = "0.1.0.dev0"
description = "Evidence-based construction payment intelligence"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy>=2.0.36,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.9,<3",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests", "backend/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency declarations are intentional, framework-managed defaults.
extend-immutable-calls = ["fastapi.Depends"]
